name: taspa
description: "A cinematic diary for movies and TV."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter_secure_storage: 10.3.4
  flutter_svg: 2.3.2
  go_router: 18.1.2
  http: 1.6.0
  url_launcher: 6.3.3
  app_links: 7.2.2
  image_picker: 1.2.4
  sqflite: 2.4.5
  pointycastle: 4.0.0
  supabase_flutter: 2.18.3
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/wordmark_ivory.svg
    - assets/fonts/InstrumentSans-OFL.txt
    - assets/fonts/InstrumentSerif-OFL.txt
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf

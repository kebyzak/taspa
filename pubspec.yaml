name: taspa
description: "A cinematic diary for movies and TV."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter_secure_storage: 10.3.4
  flutter_svg: 2.3.2
  go_router: 18.1.2
  http: 1.6.0
  url_launcher: 6.3.3
  app_links: 7.2.2
  image_picker: 1.2.4
  sqflite: 2.4.5
  pointycastle: 4.0.0
  supabase_flutter: 2.18.3
  uuid: 4.6.0
  file_picker: 13.4.0
  share_plus: 13.3.1
  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/wordmark_ivory.svg
    - assets/brand/tomato.svg
    - assets/fonts/NotoSans-OFL.txt
    - assets/fonts/Gloock-OFL.txt
    - assets/fonts/Phosphor-LICENSE.txt
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Gloock
      fonts:
        - asset: assets/fonts/Gloock-Regular.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
